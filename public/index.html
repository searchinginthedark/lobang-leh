<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c82626">
<meta name="color-scheme" content="light dark">
<title>LobangLeh</title>
<meta name="description" content="Singapore F&amp;B promotions and new openings.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand-row">
      <div>
        <h1 class="brand">LobangLeh</h1>
        <p class="sub">Got a good deal! Singapore food promos and new openings.</p>
      </div>
      <button type="button" id="refresh" class="icon-btn" aria-label="Refresh deals">Refresh</button>
    </div>
    <p class="fresh" id="fresh"><span id="fresh-text">Loading...</span> <span id="stale" class="badge b-warn" hidden>Stale</span></p>
    <details class="health" id="health" hidden>
      <summary id="health-sum"></summary>
      <ul id="health-list" class="health-list"></ul>
    </details>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Views">
    <button type="button" role="tab" class="tab" data-view="hot" aria-selected="true">Hot</button>
    <button type="button" role="tab" class="tab" data-view="ending" aria-selected="false">Ending soon</button>
    <button type="button" role="tab" class="tab" data-view="new" aria-selected="false">New openings</button>
    <button type="button" role="tab" class="tab" data-view="saved" aria-selected="false">Saved</button>
  </nav>

  <section class="filters" aria-label="Filters">
    <label class="sr" for="q">Search deals</label>
    <input type="search" id="q" class="search" placeholder="Search merchant, deal or detail" autocomplete="off">
    <div class="chips" id="chips" role="group" aria-label="Category"></div>
    <div class="chips" role="group" aria-label="Quick filters">
      <button type="button" class="chip" id="t-1for1" aria-pressed="false">1-for-1</button>
      <button type="button" class="chip" id="t-free" aria-pressed="false">Free</button>
      <button type="button" class="chip chip-clear" id="clear" hidden>Clear filters</button>
    </div>
  </section>

  <main id="list" class="list" aria-live="polite"></main>
  <div id="state" class="state" hidden></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
