# LobangLeh place lexicon: where a deal or opening is, read from the post's own words.
# Matched case-insensitively on WORD BOUNDARIES, longest name first, after known merchant names
# are masked out ("Tiong Bahru Bakery" is a chain, not a place). Nothing is guessed: a post that
# names no place gets no place.
#
# Regions are the colloquial five a Singaporean filters by, NOT the URA planning regions: URA puts
# Katong, Marine Parade and Geylang in Central, which nobody searching "east" would expect.
#
# stations: MRT stations (no LRT) by region. A name in `qualified` only matches when followed by
#   "MRT" or "station", because the bare word means something else ("Lavender latte", "Expo",
#   "Downtown", "Canberra", "Stadium").
# places: malls, food centres and neighbourhoods. `mrt` is the nearest station (must be one listed
#   under stations); omit it when nothing is within a short walk, and give `region` instead.
# ignore: phrases that contain a place word but are a brand or a dish, removed before matching.

