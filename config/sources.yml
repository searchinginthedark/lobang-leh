# LobangLeh source registry. Measured 2026-10-03 from a residential IP (Singapore); CI IP not yet verified.
# ua = the plainest User-Agent that was measured working: 'library' (Python-urllib) or 'browser' (Chrome string).
# fnb_only: the publisher only covers food, so a headline needs no food keyword to count.
# F&B counts use a loose keyword regex over the newest items; treat them as relative, not exact.
