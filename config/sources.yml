  # ---- scrapers / APIs (added 2026-10-03) ----
  - name: misslobang_food
    type: scrape
    parser: misslobang
    url: https://www.misslobang.com/category/food
    publisher: Miss Lobang
    tier: deals
    scope: mixed
    # NOT fnb_only: the "Food" category also carries bedsheets, LEGO and F1 events (measured
    # 2026-10-03), so its headlines must show F&B evidence like any aggregator's.
    ua: browser
    note: "measured 2026-10-03: 74 items (cards older than 60 days dropped), newest 2026-10-03; 1.7 MB page; undated cards fall back to fetch time"
  - name: misslobang_deals
    type: scrape
    parser: misslobang
    url: https://www.misslobang.com/category/deals
    publisher: Miss Lobang
    tier: deals
    scope: mixed        # Deals category mixes F&B with retail/travel; classifier filters
    ua: browser
    note: "measured 2026-10-03: 80 items capped, ~21 F&B by classifier, newest 2026-10-03; 4.2 MB page, not newest-first (hence the 60-day filter)"
  - name: dbs_dining
    type: scrape
    parser: dbs_dining
    url: https://www.dbs.com.sg/personal/promotion/cards-wonderful-dining
    publisher: DBS/POSB Cards
    tier: deals
    scope: promo
    fnb_only: true      # dining-only page
    standing: true      # undated standing offers: live while the page lists them (fetch.py `listed`)
    ua: browser
    note: "measured 2026-10-03: 39 unique standing card offers, no dates (all look new on first run, then dedupe)"
  - name: tsl_birthday
    type: scrape
    parser: tsl_birthday
    url: https://thesmartlocal.com/read/birthday-deals-freebies-singapore/
    publisher: TheSmartLocal
    tier: media
    scope: promo
    # NOT fnb_only: the roundup also lists Uniqlo, Sephora, Timezone.
    birthday_only: true # every entry is a customer birthday perk (lobang/birthday.py)
    standing: true      # undated standing perks: live while the roundup lists them
    ua: browser
    note: "measured 2026-10-03: 33 entries, 31 with a 'Redeem on:' line; article updated 2026-05-15"
  - name: gnews_birthday
    type: gnews
    query: 'Singapore birthday treat OR "birthday month" OR "birthday freebie" food'
    publisher: Google News
    tier: news
    scope: promo
    ua: library
    note: "added 2026-10-03; brand anniversaries ('turns 35') are filtered by lobang/birthday.py BRAND"
  - name: hungrygowhere
    type: scrape
    parser: hungrygowhere
    url: https://www.hungrygowhere.com/
    publisher: HungryGoWhere
    tier: media
    scope: mixed
    fnb_only: true      # food-only publisher
    ua: browser
    note: "measured 2026-10-03: 8 items (homepage cards, several tagged New Openings), newest 2026-10-02; RSS and /food-news/ answer 500"
